:root{
  --bg:#F4F5F0;
  --surface:#FFFFFF;
  --surface-2:#EAF2EE;
  --surface-3:#FFF6E8;
  --ink:#141A17;
  --muted:#66706A;
  --line:#DDE5DE;
  --primary:#0F766E;
  --primary-dark:#0B5A53;
  --accent:#F59E0B;
  --danger:#DC2626;
  --ok:#15803D;
  --shadow:0 10px 30px rgba(20,26,23,.08);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#101714;
    --surface:#1A221E;
    --surface-2:#233329;
    --surface-3:#2A241A;
    --ink:#F2F5F2;
    --muted:#A8B3AA;
    --line:#2E3A32;
    --primary:#2DD4BF;
    --primary-dark:#5EEAD4;
    --accent:#FBBF24;
    --danger:#F87171;
    --ok:#4ADE80;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Outfit',system-ui,-apple-system,sans-serif
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

input,select,textarea{
  width:100%;
  border:1.5px solid var(--line);
  border-radius:12px;
  padding:12px 13px;
  background:var(--surface);
  color:var(--ink);
  outline:none
}

input:focus,select:focus,textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent)
}

.font-display{
  font-family:'Fraunces',Georgia,serif
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}
